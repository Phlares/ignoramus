  { path = "design.conditions", check = "required" },
  { path = "design.conditions[*].id", check = "required" },
  { path = "design.selection", check = "required" },
  { path = "design.selection.clusters", check = "required" },
  { path = "design.confirmation", check = "required" },
  { path = "design.confirmation.clusters", check = "required" },
  { path = "inputs", check = "required" },
  { path = "inputs[*].path", check = "required" },
