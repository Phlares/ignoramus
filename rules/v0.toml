  { path = "question.negative_control", check = "required" },
  { path = "question.hypotheses", check = "required" },
  { path = "question.hypotheses[*].id", check = "required" },
  { path = "question.hypotheses[*].statement", check = "required" },
  { path = "question.hypotheses[*].rival", check = "required" },
  { path = "outcomes", check = "required" },
  { path = "outcomes[*].id", check = "required" },
  { path = "outcomes[*].registered", check = "required" },
  { path = "scope", check = "required" },
  { path = "scope.stop_rule", check = "required" },
  { path = "scope.budget", check = "required" },
  { path = "scope.budget.cpu_hours", check = "required" },
  { path = "scope.budget.wall_hours", check = "required" },
  { path = "scope.budget.money_usd", check = "required" },
  { path = "scope.end_of_run", check = "required" },
  { path = "scope.end_of_run.route", check = "required" },
  { path = "scope.end_of_run.follow_on", check = "required" },
  { path = "scope.end_of_run.follow_on[*].when", check = "required" },
  { path = "scope.end_of_run.follow_on[*].spec", check = "required" },
  { path = "design", check = "required" },
  { path = "design.unit", check = "required" },
  { path = "design.cluster", check = "required" },
  { path = "design.stratum", check = "required" },
  { path = "design.reference", check = "required" },
  { path = "design.row_seconds", check = "required" },
  { path = "design.test", check = "required" },
  { path = "design.sesoi", check = "required" },
  { path = "design.icc", check = "required" },
  { path = "design.units_per_cluster", check = "required" },
  { path = "design.variance", check = "required" },
