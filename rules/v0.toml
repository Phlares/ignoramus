# Rules for ignorarium v0. One [[rule]] per code, one `target` entry per checked path.
# Paths use dots and [*] for every array element. "**" means any depth.
# Checks: required, non-empty, type, enum, range, format, finite, known-key, unique, named:<name>.
# `unique` takes an optional `key`: the field to compare across an array of tables.

[[rule]]
code = "E-REQ-001"
severity = "error"
problem = "A required field is missing."
instruction = "Add the field. Copy its shape from the template."
why = "The checker and the run need every field. A silent default would hide a gap in the plan."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "study", check = "required" },
  { path = "study.id", check = "required" },
  { path = "study.template", check = "required" },
  { path = "study.mode", check = "required" },
