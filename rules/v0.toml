problem = "A field has the wrong type."
instruction = "Use the type the template shows for this field. Each value in a condition's params is a string or a number, or a table { from = \"<study id>\" } that takes the condition that study selected. A param that takes a value from a study has a key of 1 to 40 characters from a-z, 0-9, _ and -."
why = "A wrong type changes what the value means, and later checks cannot read it."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "study", check = "type", kind = "table" },
  { path = "study.id", check = "type", kind = "string" },
