[[rule]]
code = "E-ENM-001"
severity = "error"
problem = "The value is not one of the allowed values."
instruction = "Use one of the values listed in the template comment for this field."
why = "A value outside the set has no defined meaning in the checker or the run."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "study.template", check = "enum", values = ["numeric-ablation", "planted-spawn"] },
  { path = "study.mode", check = "enum", values = ["exploratory", "confirmatory"] },
  { path = "study.label", check = "enum", values = ["signal", "confirmed", "replicated", "generalized"] },
  { path = "scope.stop_rule", check = "enum", values = ["budget-only", "e-process"] },
  { path = "scope.end_of_run.route", check = "enum", values = ["report", "follow-on", "share"] },
  { path = "design.pick", check = "enum", values = ["seeded", "first"] },
  { path = "design.selection.rule", check = "enum", values = ["best-mean"] },
  { path = "design.resize.rule", check = "enum", values = ["blinded-once"] },
  { path = "outcomes[*].paired", check = "enum", values = ["difference", "percent", "log-ratio"] },
  { path = "inputs[*].role", check = "enum", values = ["calibration", "selection", "confirmation", "model", "reserve"] },
  { path = "inputs[*].licence.type", check = "enum", values = ["common", "custom", "request-form", "unspecified"] },
  { path = "mutations.operators[*].type", check = "enum", values = ["int", "float", "enum"] },
  { path = "report.publish", check = "enum", values = ["none", "zenodo-sandbox"] },
  { path = "pins.deviations[*].timing", check = "enum", values = ["before-collection", "during-collection", "after-collection-before-access", "after-access-before-results", "after-results"] },
]

[[rule]]
code = "E-RNG-001"
severity = "error"
problem = "A number is outside its allowed range."
instruction = "Bring the value into range: min_isolation 0 to 3, power 0.5 to 0.999, repeats at least 1, each budget value 0 or more, row_seconds above 0, row_memory_mib 1 up to 1048576, units_per_cluster 1 up to 4294967295, each input's units 1 up to 4294967295, repeats up to 4294967295, depth_cap 0 to 255, each trigger threshold_e above 0."
why = "Values outside these ranges are meaningless or make the sample-size maths fail."
sources = ["https://doi.org/10.1038/nrn3475", "https://doi.org/10.1136/bmj.e5661"]
target = [
  { path = "scope.min_isolation", check = "range", interval = "[0, 3]" },
  { path = "design.power", check = "range", interval = "[0.5, 0.999]" },
  { path = "design.repeats", check = "range", interval = "[1, 4294967295]" },
  { path = "scope.budget.cpu_hours", check = "range", interval = "[0, inf)" },
  { path = "scope.budget.wall_hours", check = "range", interval = "[0, inf)" },
  { path = "scope.budget.money_usd", check = "range", interval = "[0, inf)" },
  { path = "design.row_seconds", check = "range", interval = "(0, inf)" },
  { path = "design.row_memory_mib", check = "range", interval = "[1, 1048576]" },
  { path = "design.units_per_cluster", check = "range", interval = "[1, 4294967295]" },
  { path = "inputs[*].units", check = "range", interval = "[1, 4294967295]" },
  { path = "mutations.depth_cap", check = "range", interval = "[0, 255]" },
  { path = "mutations.triggers[*].threshold_e", check = "range", interval = "(0, inf)" },
]

[[rule]]
code = "E-FMT-001"
severity = "error"
problem = "An id, a stratum or a study reference is not ASCII letters and digits joined by single hyphens."
instruction = "Use ASCII lowercase letters and digits, joined by single hyphens, for example my-study. A hypothesis id may also use capital letters, for example E1 or P1a. A stratum may be empty where the design or an input names none, but not in the strata a hypothesis lists. estimates.from, a param's from and a deviation's from name a study id."
why = "Ids and strata become file names, seed inputs and record keys, and are printed in diagnostics. Accents and look-alike letters would make two ids that look the same differ."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "study.id", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "question.hypotheses[*].id", check = "format", pattern = "^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$" },
  { path = "design.conditions[*].id", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "outcomes[*].id", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "design.stratum", check = "format", pattern = "^([a-z0-9]+(-[a-z0-9]+)*)?$" },
  { path = "inputs[*].stratum", check = "format", pattern = "^([a-z0-9]+(-[a-z0-9]+)*)?$" },
  { path = "question.hypotheses[*].strata[*]", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "question.hypotheses[*].estimates.from", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "design.conditions[*].params.*.from", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
  { path = "pins.deviations[*].from", check = "format", pattern = "^[a-z0-9]+(-[a-z0-9]+)*$" },
]

[[rule]]
code = "E-FMT-003"
severity = "error"
problem = "An input hash is not a SHA-256 digest."
instruction = "Use 64 lowercase hex characters, or leave it empty until the input is pinned."
why = "The run compares this hash with the file it reads. Any other form can never match."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "inputs[*].sha256", check = "format", pattern = "^([0-9a-f]{64})?$" },
]

[[rule]]
code = "E-NUM-001"
severity = "error"
problem = "A number is not finite (nan or inf)."
instruction = "Replace nan or inf with a finite value."
why = "TOML allows nan and inf, but JSON does not. The spec hash and the sample-size maths need finite numbers."
sources = ["https://www.rfc-editor.org/rfc/rfc8259#section-6", "https://toml.io/en/v1.0.0#float"]
target = [
  { path = "**", check = "finite" },
]

[[rule]]
code = "E-KEY-001"
severity = "error"
problem = "The spec has a field the schema does not define."
instruction = "Remove the field, or fix its name. The template lists every field."
why = "A misspelt field is silently ignored by most readers. Rejecting it keeps the plan and the run in step."
sources = ["https://toml.io/en/v1.0.0"]
target = [
  { path = "**", check = "known-key" },
]

[[rule]]
code = "E-UNQ-001"
severity = "error"
problem = "A list repeats an id, path or name."
instruction = "Give every entry its own value. Remove the repeat, or rename it."
why = "A repeated input would run its units twice and count them twice in the power gate. A stage that lists a condition twice runs it twice. A repeated condition, outcome, measure, hypothesis, operator or trigger id makes later steps pick one entry and ignore the other. Two deviations from one study would record two reasons for one change."
sources = []
target = [
  { path = "design.conditions", check = "unique", key = "id" },
  { path = "design.selection.conditions", check = "unique" },
  { path = "design.confirmation.conditions", check = "unique" },
  { path = "outcomes", check = "unique", key = "id" },
  { path = "outcomes", check = "unique", key = "measure" },
  { path = "question.hypotheses", check = "unique", key = "id" },
  { path = "inputs", check = "unique", key = "path" },
  { path = "mutations.operators", check = "unique", key = "name" },
  { path = "mutations.triggers", check = "unique", key = "id" },
  { path = "pins.deviations", check = "unique", key = "from" },
]

[[rule]]
code = "E-OUT-001"
severity = "error"
problem = "An outcome has no unit."
instruction = "Give every outcome a unit, for example ratio or seconds."
why = "An effect size has no meaning without its unit. Margins and power_at are stated in this unit."
sources = ["https://doi.org/10.1136/bmj.e7586"]
target = [
  { path = "outcomes[*].unit", check = "non-empty" },
]

[[rule]]
code = "E-OUT-002"
severity = "error"
problem = "An outcome does not say which direction is better."
instruction = "Set direction to lower or higher, whichever is better for this outcome."
why = "The test needs to know which way counts as an improvement. Choosing after the data are in would bias the result."
sources = ["https://doi.org/10.1136/bmj.e7586"]
target = [
  { path = "outcomes[*].direction", check = "required" },
  { path = "outcomes[*].direction", check = "enum", values = ["lower", "higher"] },
]

[[rule]]
code = "W-LIC-001"
severity = "warning"
problem = "An input has no licence id."
instruction = "Add the licence the authors gave the data, as an SPDX id. Publishing is blocked until you do."
why = "Re-sharing data without its licence can break the terms the authors set. The run itself does not need it."
sources = ["https://spdx.org/licenses/"]
target = [
  { path = "inputs[*].licence.spdx", check = "non-empty" },
]

[[rule]]
code = "W-HSH-001"
severity = "warning"
problem = "An input has no SHA-256 pin."
instruction = "Pin the input: add its SHA-256, 64 lowercase hex characters."
why = "Without a pin the run cannot tell if the file changed after the plan was approved. The run itself still starts."
sources = []
target = [
  { path = "inputs[*].sha256", check = "non-empty" },
]

[[rule]]
code = "E-REF-001"
severity = "error"
problem = "design.conditions is empty, or design.reference is not one of its ids."
instruction = "List at least one condition in design.conditions. Set design.reference to the id of one of them."
why = "Every comparison is made against the reference condition. A reference that matches no condition leaves the run with nothing to compare to, and the registered id cannot be reused."
sources = []
target = [
  { path = "design.conditions", check = "non-empty" },
  { path = "design.reference", check = "named:condition-declared" },
]

[[rule]]
code = "E-REF-002"
severity = "error"
problem = "A reference names this study, or a study that recorded no selection."
instruction = "Set estimates.from or a param's from to the id of another study: one that has run, or will run, before this one. A param takes the condition that study selected, so that study needs a selection stage."
why = "A value taken from a study exists only once that study has finished. This study's own values come from this run, so a plan cannot be sized by them or take a condition from them. A study without a selection stage selects no condition."
sources = []
target = [
  { path = "question.hypotheses[*].estimates.from", check = "named:reference-not-self" },
  { path = "design.conditions[*].params.*.from", check = "named:reference-not-self" },
]

[[rule]]
code = "W-REF-001"
severity = "warning"
problem = "A value waits on a study that has not finished."
instruction = "Run the study it names to its end, then check again. Until then check exits 3 and register refuses the plan; nothing else needs to change."
why = "A follow-on plan is written and checked before the study it builds on runs. Its values are read from that study's records once the study has written them all, so a value cannot change after the plan is registered. The box cannot read a study it has not run."
sources = []
target = [
  { path = "question.hypotheses[*].estimates", check = "named:reference-finished" },
  { path = "design.conditions[*].params.*", check = "named:reference-finished" },
]

[[rule]]
code = "E-REF-003"
severity = "error"
problem = "The plan takes estimates from a study that ran other code, and declares no deviation from it."
instruction = "Pin the source study's payload, environment and model and calibration inputs, or add a `[[pins.deviations]]` entry with `from`, `reason` and `timing`. A deviation names a study that a confirmatory hypothesis with a claim takes estimates from, and gives a reason."
why = "Estimates describe the code that produced them. A pipeline is frozen before the confirmatory data exist, and a change is reported with its reason and when it happened."
sources = ["https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3000246", "https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1010571", "https://doi.org/10.1177/25152459231213802"]
target = [
  { path = "question.hypotheses[*].estimates", check = "named:estimates-same-code" },
  { path = "pins.deviations[*].from", check = "named:deviation-borrowed" },
  { path = "pins.deviations[*].reason", check = "non-empty" },
]

[[rule]]
code = "E-LBL-001"
severity = "error"
problem = "An exploratory study carries a label above signal."
instruction = "Set label to signal, or change the mode to confirmatory."
why = "Only a confirmatory study with a registered test can earn a stronger label. Exploratory results are leads."
sources = []
when = { mode = "exploratory" }
target = [
  { path = "study.label", check = "named:label-allowed-for-mode" },
]

[[rule]]
code = "E-CNF-001"
severity = "error"
problem = "A confirmatory hypothesis has no power_at strictly on its claimed side, or power_at lies outside the range of its mean statistic."
instruction = "Set power_at to the true value of the statistic at which the test must have its power: below m for a claim below m, above m for a claim above m, strictly between a and b for a claim within [a, b], and inside [lo, hi] for a mean statistic."
why = "The sample size depends on the effect the study must detect, so the power gate needs a value to size at. It is set when the plan is written, not read from a pilot: an effect seen in a small pilot is noisy, and sizing at it gives studies too small to detect the effect."
sources = ["https://doi.org/10.1016/j.jesp.2017.09.004", "https://doi.org/10.1038/nrn3475"]
when = { mode = "confirmatory" }
target = [
  { path = "question.hypotheses[*].power_at", check = "named:power-at-side" },
]

[[rule]]
code = "E-CNF-002"
severity = "error"
problem = "The confirmation sample is too small."
instruction = "Add confirmation inputs to each stratum the detail names, until each has the clusters the power gate needs. The detail states the simulated power and about how many clusters per stratum reach design.power. Raising design.units_per_cluster helps only as far as the icc allows, since the test takes one value per cluster. A mean range wider than the cluster means need also costs power. Two inputs that hold the same data are one cluster. In a study that re-sizes, add reserve inputs to each stratum the claim lists instead, and keep the first batch as declared."
why = "A test with too few clusters misses real effects and exaggerates the ones it finds. The gate simulates the test the box runs: one value per cluster, a bounded betting e-value for each bound in each stratum the claim lists (all confirmation inputs when it lists none), and a pass only when every bound in every stratum reaches 1 / (the level the stream gives the study x alpha_share). It draws 4,000 replicates of each stratum's own clusters from a normal model with the sd and icc from the study in estimates, centred on power_at; for a quantile claim, the units' quantile lies at power_at. For a mean claim each simulated cluster mean is clipped to the declared range, as the test clips each unit; the two agree while the units stay inside the range, and the claim is about the clipped mean. The borrowed sd and icc are those of the source study's unit values clipped to the declared range, as the test clips them, and of several arms a mean claim takes the one whose cluster mean has the largest sd over the units its clusters give, with its own sd and icc together; a quantile claim takes the largest sd and the largest icc. Each simulation draws at most 2,000 million values, so a quantile claim on very large clusters fails closed instead of running for hours. The power is that of the joint event, so each of several strata needs more than the target alone. The seed comes from the spec hash and the hypothesis id, so every check of a spec gives the same power. A one-sided z-test needs fewer clusters than the e-value test, so a mean claim with fewer clusters than the z count fails first, without the simulation. The z count assumes the box estimates the statistic as the unweighted mean of the cluster means, and so uses the harmonic mean of the units the clusters give. The model is normal: a skewed outcome can have another power. A study that re-sizes is simulated whole: each replicate draws the first batch, sizes it as the re-size would from its spread about 0, fails when the reserve holds too few clusters, and tests the first batch then the clusters added, with no z count, since that assumes a fixed number of clusters."
sources = ["https://doi.org/10.1038/nrn3475", "https://doi.org/10.1136/bmj.e5661", "https://doi.org/10.1186/1471-2288-11-94", "https://arxiv.org/abs/2010.09686", "https://doi.org/10.1080/00401706.1982.10487790"]
when = { mode = "confirmatory" }
target = [
  { path = "question.hypotheses[*]", check = "named:power-met" },
]

[[rule]]
code = "E-STR-001"
severity = "error"
problem = "The stream gives this confirmatory study no level."
instruction = "Run the plan as an exploratory study, or set study.test_log = true to try it against the test stream, which never counts and never runs out. The plan stream gives levels to its first 10 confirmatory studies only, and keeps one slot free for each member of a registered family that has not registered yet. A stream log that cannot be read, or that lacks a slot a register record names, must be restored from a copy that holds every slot before any confirmatory study registers."
why = "A confirmatory study takes its level from the stream of the log it registers in, never from the plan: e-LOND with alpha 0.05 split evenly over 10 slots. A slot's level is 0.005 times one more than the discoveries closed before it opened, and a slot is a discovery when the study's e-value reaches 1 / level, which happens exactly when one of its claims passes. When each study's e-value has expected value at most 1 under its null hypothesis, as the box's fixed-size tests give, the false discovery rate over the studies the stream counts as discoveries stays at or below 0.05, whatever the dependence between the studies. The slots go in the order studies register, which is fixed before any result. The plan stream never resets and refuses a study beyond its 10th slot, so results never stretch the budget to more studies. The test stream starts a new epoch, a fresh stream of 10 slots, each time its slots are used up, because its studies never count. Each slot records its level, its e-value and the decision. Every slot a register record names must be in the stream, so a stream log that was cut or rolled back is refused, not read as a fresh budget. register opens the slot and refuses when the level has dropped below the one check showed. A registered family reserves a plan slot for each member not yet registered, so a study outside it may take a slot only when the slots after it still cover those members; a member's own slot is among them."
sources = ["https://arxiv.org/abs/2311.06412", "https://arxiv.org/abs/2208.11418", "https://doi.org/10.1038/s41562-017-0189-z"]
when = { mode = "confirmatory" }
target = [
  { path = "study.mode", check = "named:stream-level" },
]

[[rule]]
code = "E-CNF-003"
severity = "error"
problem = "A confirmatory hypothesis takes its sd and icc from no matching estimate of a finished study."
instruction = "Set estimates = { from = \"<study id>\" } to a study in this box that measured this hypothesis's contrast: the same outcome, measure and paired rule, the same reference condition with the same params, and the same conditions, weights and params. A contrast on selected needs an estimate for each candidate. The study needs an estimate in each stratum the hypothesis lists, or a pooled one, with an icc, which takes 2 or more clusters and more units than clusters. Estimates of one contrast in one stratum must agree."
why = "A variance typed by hand can be too small, which makes the power gate pass a study that is too small. The box reads the sd and icc from the records of a finished study instead, so no one types them."
sources = ["https://doi.org/10.1038/nrn3475", "https://doi.org/10.1136/bmj.e5661"]
when = { mode = "confirmatory" }
target = [
  { path = "question.hypotheses[*].estimates", check = "named:estimates-from-record" },
]

[[rule]]
code = "E-CNF-004"
severity = "error"
problem = "The plan has no confirmation input, or a confirmation or reserve input holds the same data as a selection or calibration input, or a reserve input holds the data of a confirmation input or of an earlier reserve input."
instruction = "Add a confirmation input. Give each confirmation and reserve input data that no selection or calibration input holds, and each reserve input data that no confirmation input and no earlier reserve input holds: not the same bytes, and not the same text in other case or spacing."
why = "A winner picked on some data looks better on that same data. Only fresh data gives an honest test. The content decides, not the file name. A model calibrated on a text has adapted to it; its error there is not its error on new text. A reserve cluster the re-size adds must be new to the test too, or the test counts one text twice."
sources = ["https://doi.org/10.1038/s41562-016-0021", "https://arxiv.org/html/2311.09755v2"]
when = { mode = "confirmatory" }
target = [
  { path = "inputs", check = "named:confirmation-disjoint" },
  { path = "inputs[*].sha256", check = "named:confirmation-disjoint" },
]

[[rule]]
code = "E-CNF-005"
severity = "error"
problem = "Confirmation or reserve data was used by an earlier study."
instruction = "Use data no earlier plan used for confirmation or reserve, or change the role of this input. Selection data may be reused."
why = "Reused data has already shaped a decision. A test on it is not independent. A reserve input is confirmation data held back, so it must be fresh too."
sources = ["https://doi.org/10.1038/s41562-016-0021"]
when = { mode = "confirmatory" }
target = [
  { path = "inputs[*].path", check = "named:data-fresh" },
]

[[rule]]
code = "E-FAM-001"
severity = "error"
problem = "An exploratory study declares a family, or a family member is not confirmatory or uses a different log from this study."
instruction = "Make this study and every member confirmatory, with the same study.test_log. An exploratory study needs no family to reuse data: remove the `[family]` table, or remove the member from it and run it as exploratory on the same data (no claim)."
why = "Members may share data because each takes its own slot in one stream, and the stream keeps the false discovery rate at or below 0.05 over its studies whatever the dependence between them, shared data included. A study in another stream, or with no slot, falls outside that bound. An exploratory study makes no claim, so it needs no family."
sources = ["https://arxiv.org/abs/2311.06412"]
target = [
  { path = "family", check = "named:family-confirmatory" },
  { path = "family.members[*]", check = "named:family-confirmatory" },
]

[[rule]]
code = "E-FAM-002"
severity = "error"
problem = "A family member cannot be read, is this study or another member again, is already registered, is already locked in a registered family, declares its own family, or lies under another study root."
instruction = "List each member once, by the path of a readable spec under this study root, and not this study itself. Only this study holds a `[family]` table. A registered study cannot join, and a study locked in another family cannot join a second one: give it fresh data, or run it as exploratory on the same data (no claim)."
why = "A family is fixed before any member runs: registering this study locks every member. A registered study may already have seen the data, so a later lock cannot cover it. A study in two families would hold two locks and two reserved slots, and each family's data rules would assume it belongs to that family alone. One table in the first study keeps each family in one place, and one study root lets one payload folder and one data folder serve every member."
sources = ["https://arxiv.org/abs/2407.15733"]
when = { mode = "confirmatory" }
target = [
  { path = "family.members[*]", check = "named:family-members" },
]

[[rule]]
code = "E-FAM-003"
severity = "error"
problem = "An input of a family member is not pinned by sha256, or its data is neither at the study root nor in the store."
instruction = "Set sha256 on every input of every member, of every role, and put each file at the study root or in the store before this study registers. Member specs are final then: nothing about a member can change after the lock."
why = "Registering this study locks every member, inputs included. The lock needs the bytes: the box compares member data with earlier uses and with selection data by content, and an absent file has no content to compare."
sources = ["https://arxiv.org/abs/2407.15733"]
when = { mode = "confirmatory" }
target = [
  { path = "family.members[*]", check = "named:family-pinned" },
]

[[rule]]
code = "E-FAM-004"
severity = "error"
problem = "A family member's confirmation or reserve data is selection data of this study or of another member."
instruction = "Give the member confirmation and reserve data that no selection input in the family holds: not the same bytes, and not the same content in other case or spacing. Or remove the member from the family and run it as exploratory on this data (no claim)."
why = "A condition picked on some data looks better on that same data. A member may test a condition that a selection stage in the family picked, so its evidence must come from other data. The content decides, not the file name."
sources = ["https://www.fda.gov/media/78495/download"]
when = { mode = "confirmatory" }
target = [
  { path = "family.members[*]", check = "named:family-selection" },
]

[[rule]]
code = "E-FAM-005"
severity = "error"
problem = "The plan stream has no free slot for every member of this family."
instruction = "Choose one: list fewer members; put this study and every member on the test stream (study.test_log = true), which never runs out and never counts; or run them as exploratory studies (no claim). The plan stream gives levels to 10 confirmatory studies, and a slot reserved for a member of a registered family stays reserved."
why = "Registering this study locks every member and reserves a plan stream slot for each, so no later study can take the slot a member needs. A member locked with no slot could never make its claim, and the data locked for it would be spent for nothing. The check counts the slot this study opens, one slot per member, and the slots already reserved for members of other families that have not registered yet."
sources = ["https://arxiv.org/abs/2311.06412"]
when = { mode = "confirmatory" }
target = [
  { path = "family", check = "named:family-room" },
]

[[rule]]
code = "E-FAM-006"
severity = "error"
problem = "This study is a member of a registered family and differs from what the family locked."
instruction = "Choose one: restore the spec, payload or input the family locked, byte for byte; or register the changed study under a new study id, as a study outside the family. Outside the family the freshness rule applies in full: it needs confirmation and reserve data no earlier study used, or it runs as exploratory on the same data (no claim)."
why = "Members may share data because every member was fixed before any of them ran. A member changed after the lock may have been shaped by what the root or another member found, so a test of it on the shared data is no longer an independent test. The lock holds each member's spec hash, payload hash and input pins, so any change shows. `check` reports this rule for confirmatory plans; `register` refuses a changed member in any mode, so no change of mode frees a locked id or its reserved slot."
sources = ["https://doi.org/10.1038/s41562-016-0021"]
when = { mode = "confirmatory" }
target = [
  { path = "study.id", check = "named:family-lock" },
]

[[rule]]
code = "W-FAM-001"
severity = "warning"
problem = "A family member's value waits on a study that has not finished."
instruction = "Nothing to do now: the member reads the value when it registers, after that study ends. If the member then fails a gate, it is refused and its reserved stream slot stays unused, so size its reserve inputs generously."
why = "A member's values may come from a study that runs first, such as a pilot or an earlier member. They are read at the member's own registration and cannot change after it. This study's check cannot run the member's gates on values that do not exist yet, so it lists each such value and the study it waits on."
sources = []
check = "documented"

[[rule]]
code = "W-FAM-002"
severity = "warning"
problem = "A confirmatory spec reachable through follow-on routes shares confirmation or reserve data with this study and is not in its family."
instruction = "To keep both claims, list that spec in this study's `[family]` before this study registers. Cost: every member is locked and takes a plan stream slot at register. Otherwise give one of the two studies fresh data, or run one as exploratory (no claim)."
why = "The later study cannot confirm on data this study used, unless both belong to one family. Once this study registers, the family option is closed. The warning shows it while it can still be taken."
sources = ["https://arxiv.org/abs/2311.06412"]
when = { mode = "confirmatory" }
target = [
  { path = "scope.end_of_run.follow_on[*].spec", check = "named:follow-on-shares" },
]

[[rule]]
code = "E-CNF-006"
severity = "error"
problem = "A confirmatory study has no hypothesis, or a hypothesis of it has no claim."
instruction = "List at least one hypothesis, and give each a claim, { below = m }, { above = m } or { within = [a, b] }, and its statistic. Or make the study exploratory."
why = "A confirmatory study tests each hypothesis against margins stated before the data come in. A hypothesis with no claim has nothing to test, so any reading of it would be chosen after the fact. A study with no hypothesis would spend a stream slot that can never give a discovery."
sources = ["https://doi.org/10.1038/s41562-016-0021"]
when = { mode = "confirmatory" }
target = [
  { path = "question.hypotheses", check = "non-empty" },
  { path = "question.hypotheses[*].claim", check = "named:claim-required" },
]

[[rule]]
code = "E-UNT-001"
severity = "error"
problem = "The plan has no selection or confirmation input, or a selection, confirmation or reserve input does not declare its units, or its stratum while the design names strata."
instruction = "List each file of units as a selection or confirmation input. Set its units to the number of units the file holds. When design.stratum is set, give each such input its stratum. A reserve input declares its units and stratum the same way."
why = "Each selection, confirmation or reserve input is one cluster, and the schedule picks its units from the count the input declares. The box does not count units itself. A plan without a selection or confirmation cluster runs nothing."
sources = []
target = [
  { path = "inputs", check = "named:units-declared" },
  { path = "inputs[*].units", check = "named:units-declared" },
  { path = "inputs[*].stratum", check = "named:units-declared" },
]

[[rule]]
code = "E-UNT-002"
severity = "error"
problem = "The schedule has more rows than the box allows."
instruction = "Lower design.units_per_cluster, design.repeats, the number of conditions a stage runs, or the units of the selection and confirmation inputs."
why = "check builds the whole schedule to count its rows and cost. A typo in a unit count must stop here, not exhaust the memory."
sources = []
target = [
  { path = "design.units_per_cluster", check = "named:row-cap" },
]

[[rule]]
code = "E-SEL-001"
severity = "error"
problem = "A stage is not well formed: a selection stage with no selection input, or a selection input with no stage; fewer than two candidates; a stage condition that is the reference or not in design.conditions; a metric that is not an outcome; selected with no selection stage; or a condition named selected."
instruction = "Give design.selection two or more candidates from design.conditions other than the reference, a metric that is an outcome id, and at least one selection input; or remove the stage and the selection inputs. List conditions from design.conditions in design.confirmation.conditions, and selected only with a selection stage. Name no condition selected."
why = "The selection stage picks one candidate on the selection inputs by a rule fixed before the data come in, and the confirmation stage then tests the pick on other data. Only a declared rule over declared candidates shows that the confirmation data did not shape the choice. The rule best-mean takes only the selection units that have a paired metric value for every candidate, and each mean is over those units. The best mean in the metric outcome's direction wins, and a tie goes to the candidate listed first. With no such unit the run pauses before any confirmation row. The reference runs in every stage."
sources = ["https://www.fda.gov/media/78495/download"]
target = [
  { path = "design.selection", check = "named:selection-stage" },
  { path = "inputs[*].role", check = "named:selection-stage" },
  { path = "design.selection.conditions", check = "named:selection-stage" },
  { path = "design.selection.conditions[*]", check = "named:condition-declared" },
  { path = "design.selection.metric", check = "named:selection-stage" },
  { path = "design.confirmation.conditions[*]", check = "named:condition-declared" },
  { path = "design.conditions[*].id", check = "named:selection-stage" },
]

[[rule]]
code = "E-RSV-001"
severity = "error"
problem = "A reserve input is listed, and design.resize declares no re-size."
instruction = "Declare the re-size: add [design.resize] with rule = \"blinded-once\". Or give the input another role."
why = "A reserve input holds confirmation clusters that run only when the re-size asks for them. Without a declared re-size, nothing fixed before the data decides whether they run, so the choice could follow the results."
sources = ["https://www.fda.gov/media/78495/download"]
when = { mode = "confirmatory" }
target = [
  { path = "inputs[*].role", check = "named:reserve-declared" },
]

[[rule]]
code = "E-RSV-002"
severity = "error"
problem = "design.resize declares a re-size, and no input is a reserve."
instruction = "List the clusters the re-size may add as inputs with role = \"reserve\", in the strata the claims list. Or remove [design.resize]."
why = "The re-size runs once, after the confirmation clusters, and counts how many reserve clusters each claimed stratum adds. With no reserve it can add nothing. The count reads the root mean square of the first clusters' observations about 0 and no condition's name. It computes no mean, but the square carries the squared effect, so the count shows a little of the effect. The e-value test keeps its level whatever count the re-size picks, because each bet uses only the observations before it."
sources = ["https://www.fda.gov/media/78495/download", "https://doi.org/10.1002/sim.1585"]
when = { mode = "confirmatory" }
target = [
  { path = "design.resize", check = "named:reserve-declared" },
]

[[rule]]
code = "E-RSV-003"
severity = "error"
problem = "A reserve input has no SHA-256 pin."
instruction = "Pin each reserve input: set sha256 to the 64 lowercase hex characters of its file's SHA-256, or import the file and use the digest `ignorarium import` prints."
why = "The re-size takes reserve clusters in the order of their pins, so the pins fix which data the test adds before any result is seen. Without a pin the order, and so the added data, could be picked after the first results. A test is honest on data fixed in advance."
sources = ["https://ar5iv.labs.arxiv.org/html/1902.10811"]
when = { mode = "confirmatory" }
target = [
  { path = "inputs[*].sha256", check = "named:reserve-pinned" },
]

[[rule]]
code = "E-RSV-004"
severity = "error"
problem = "A stratum a claim lists has no reserve input, a reserve input's stratum is one no claim lists, or a claim with no strata has reserve inputs in more than one stratum."
instruction = "Give each stratum a claim lists at least one reserve input in that stratum, and list no reserve input in a stratum no claim lists. A claim with no strata takes every reserve input, so keep them all in one stratum, or list the strata in the claim."
why = "The re-size counts the clusters each claimed stratum needs and takes them from that stratum's reserve. A claimed stratum with no reserve cannot grow, and a reserve that no claim reads holds data no test uses. A claim with no strata takes reserve clusters one stratum after another, so a count smaller than the reserve would add only the first stratum's clusters and shift the pooled mean toward that stratum."
sources = ["https://www.fda.gov/media/78495/download"]
when = { mode = "confirmatory" }
target = [
  { path = "design.resize", check = "named:reserve-strata" },
]

[[rule]]
code = "E-RSV-005"
severity = "error"
problem = "design.resize declares a re-size that no test can use."
instruction = "In an exploratory study, remove [design.resize] or make the study confirmatory. In a study that re-sizes, give each claim a mean statistic."
why = "The re-size sizes a confirmatory test from one observation per cluster. An exploratory study tests no claim, and the bounds of a quantile claim each read their own observation, so the count would size a test that does not run."
sources = ["https://www.fda.gov/media/78495/download"]
target = [
  { path = "design.resize", check = "named:resize-tested" },
]

[[rule]]
code = "E-HYP-001"
severity = "error"
problem = "A hypothesis names an outcome that is not listed, or its contrast is empty, has a weight of 0, or names a condition the confirmation stage does not run."
instruction = "Set outcome to an id from outcomes. Give contrast one or more condition ids from design.confirmation.conditions, each with a weight other than 0, for example { selected = 1.0 } or { arm-a = 1.0, arm-b = -1.0 }. Name selected only with a selection stage, and never the reference."
why = "The test reads the contrast's paired values in the confirmation stage. A condition that stage does not run, or the reference, which has no paired value, leaves every unit incomplete, and the claim fails after the budget is spent."
sources = []
target = [
  { path = "question.hypotheses[*].outcome", check = "named:hypothesis-shape" },
  { path = "question.hypotheses[*].contrast", check = "named:hypothesis-shape" },
  { path = "question.hypotheses[*].contrast.*", check = "named:hypothesis-shape" },
  { path = "question.hypotheses[*].contrast.*", check = "named:condition-declared" },
]

[[rule]]
code = "E-HYP-002"
severity = "error"
problem = "A stratum a hypothesis lists has no confirmation input."
instruction = "List only strata that confirmation inputs name in their stratum field, or add a confirmation input for the stratum. Leave strata empty to test all units as one group."
why = "A claim holds only when it holds in every stratum it lists, each tested on its own clusters. A stratum with no confirmation input has no data, so the claim could never hold."
sources = ["https://doi.org/10.1080/00401706.1982.10487790"]
target = [
  { path = "question.hypotheses[*].strata[*]", check = "named:hypothesis-strata" },
]

[[rule]]
code = "E-HYP-003"
severity = "error"
problem = "A claim or a statistic is not well formed."
instruction = "Write the claim as one of { below = m }, { above = m } or { within = [a, b] } with a below b. Give a claim one statistic: { mean = [lo, hi] } with lo below hi and every margin strictly between them, or { quantile = q } with q strictly between 0 and 1."
why = "A claim is one or two one-sided bounds, and it holds when every bound holds. within [a, b] is two one-sided tests, above a and below b, so it needs no alpha correction. The test counts each cluster once: the mean of its units, or the share of its units on the claimed side. Before a mean is taken, each unit is clipped to the declared range, so every cluster mean lies inside it and the claim is about the mean of the clipped units. A unit far outside the range cannot then push a cluster mean outside it, which the test could not bound. A margin at or outside the range can never be tested."
sources = ["https://doi.org/10.1080/00401706.1982.10487790", "https://doi.org/10.1177/1948550617697177"]
target = [
  { path = "question.hypotheses[*].claim", check = "named:hypothesis-shape" },
  { path = "question.hypotheses[*].statistic", check = "named:hypothesis-shape" },
]

[[rule]]
code = "E-HYP-004"
severity = "error"
problem = "A confirmatory hypothesis has no alpha share above 0 and at most 1, or the shares do not sum to 1."
instruction = "Give each hypothesis with a claim an alpha_share above 0 and at most 1, so that the shares of the study sum to 1. A study with one hypothesis sets alpha_share = 1.0."
why = "The study's level is split between its claims. Shares that sum to more than 1 would let the study reject more often than its level allows, and shares that sum to less waste power."
sources = []
when = { mode = "confirmatory" }
target = [
  { path = "question.hypotheses[*].alpha_share", check = "named:alpha-shares" },
  { path = "question.hypotheses", check = "named:alpha-shares" },
]

[[rule]]
code = "E-BUD-001"
severity = "error"
problem = "The budget is empty."
instruction = "Set at least one of cpu_hours, wall_hours or money_usd above 0."
why = "A run with no budget has no stop. The budget is the cap the run enforces."
sources = []
target = [
  { path = "scope.budget", check = "named:budget-present" },
]

[[rule]]
code = "E-END-001"
severity = "error"
problem = "The end-of-run route is not valid."
instruction = "For route follow-on, list at least one follow_on entry. Write each when as done, which runs the follow-on whatever the result, or as <hypothesis id>.pass or <hypothesis id>.fail, using a hypothesis that has a claim."
why = "A follow-on whose condition can never be met never runs. A hypothesis with no claim has no pass or fail: a confirmatory claim passes on its test, an exploratory one on its point estimate. The route must say what happens, before the data come in."
sources = []
target = [
  { path = "scope.end_of_run.follow_on", check = "named:route-valid" },
  { path = "scope.end_of_run.follow_on[*].when", check = "named:route-valid" },
]

[[rule]]
code = "E-END-002"
severity = "error"
problem = "A follow-on spec file is missing."
instruction = "Create the file under the study root, or fix the spec path."
why = "The run would reach the follow-on step and find nothing to run."
sources = []
target = [
  { path = "scope.end_of_run.follow_on[*].spec", check = "named:follow-on-exists" },
]

[[rule]]
code = "E-MUT-001"
severity = "error"
problem = "The spawn depth cap is above 2."
instruction = "Set mutations.depth_cap to 2 or less."
why = "Each spawn level multiplies the number of runs and the chances of a chance finding. The cap is 2."
sources = []
target = [
  { path = "mutations.depth_cap", check = "named:depth-cap" },
]

[[rule]]
code = "E-MUT-002"
severity = "error"
problem = "The spawn and report seed sets overlap."
instruction = "Give spawn and report seed prefixes where neither is a prefix of the other, for example spawn/ and report/."
why = "Overlapping seeds would let spawned runs reuse the draws that the report runs use."
sources = []
target = [
  { path = "mutations.seeds", check = "named:seed-sets-disjoint" },
]

[[rule]]
code = "E-MUT-003"
severity = "error"
problem = "A trigger names a metric that is not an outcome."
instruction = "Set the trigger metric to the id of an outcome."
why = "A trigger on an unregistered metric would let the run pick its own signal after the fact."
sources = []
target = [
  { path = "mutations.triggers[*].metric", check = "named:trigger-declared" },
]

[[rule]]
code = "E-ISO-001"
severity = "error"
problem = "This machine cannot give the isolation level the plan asks for."
instruction = "Lower scope.min_isolation, or run the plan on a machine that offers the level."
why = "Running at a lower level than the plan asks for would break the plan's own safety terms."
sources = []
target = [
  { path = "scope.min_isolation", check = "named:isolation-reachable" },
]

[[rule]]
code = "E-PTH-001"
severity = "error"
problem = "A file path is absolute, starts with a drive, has a . or .. segment, contains a backslash or a colon, has a segment ending in a dot or space, passes through a symbolic link, lies inside the path of another input, or names the file of another input in another spelling."
instruction = "Write the path from the study root with no `.` or `..` segment, no `:` or `\\`, and no segment ending in a dot or space; write `data/x.txt`, not `./data/x.txt`. List a folder or the files in it, not both, and name each file once."
why = "The checker reads only files inside the study root. It never follows links, so a spec cannot point it at other files."
sources = []
target = [
  { path = "inputs[*].path", check = "named:input-path-safe" },
  { path = "inputs[*].path", check = "named:input-path-nested" },
  { path = "scope.end_of_run.follow_on[*].spec", check = "named:input-path-safe" },
  { path = "family.members[*]", check = "named:input-path-safe" },
]

[[rule]]
code = "E-HSH-001"
severity = "error"
problem = "An input is in neither place: the pin names no object in the box's store, and the file is missing or its SHA-256 differs from the pin."
instruction = "Fix the path, or update the sha256 if the file was changed on purpose. To pin a stored object, run `ignorarium import` and use the digest it prints."
why = "The pin says which bytes the plan was approved on. A different file is a different study."
sources = []
target = [
  { path = "inputs[*].sha256", check = "named:input-hash-matches" },
]

[[rule]]
code = "E-SEC-001"
severity = "error"
problem = "A string looks like a secret or personal data; the diagnostic names the kind."
instruction = "Remove the value from the spec, or move it out of the spec and refer to it by name. Do not copy the value into any other text."
why = "A registered plan is kept and shared. A secret or personal detail in it cannot be taken back."
sources = ["https://github.com/gitleaks/gitleaks"]
target = [
  { path = "**", check = "named:secret-scan" },
  { path = "comments", check = "named:comment-scan" },
]

[[rule]]
code = "E-REG-001"
severity = "error"
problem = "`register` needs a person at a terminal, and standard input is not a terminal."
instruction = "Ask the person to run `ignorarium register <spec>` in an interactive terminal and type the approval themselves. Do not pipe or script the approval."
why = "Registration locks the plan. The person who owns the study must approve it by reading the hash, not a program acting for them."
sources = []
check = "documented"

[[rule]]
code = "E-REG-002"
severity = "error"
problem = "A study with this id is already registered in the box."
instruction = "Choose a new `study.id` for a new plan. A registered plan cannot be replaced."
why = "A plan registered once is fixed. A second plan under the same id would hide the first."
sources = []
check = "documented"

[[rule]]
code = "E-REG-003"
severity = "error"
problem = "The study root has no usable `payload/` folder, or `pins.payload` is not its hash."
instruction = "Put the payload in `payload/` under the study root: an executable `payload/run`, and only regular files and folders below it, no links. Leave `pins.payload` empty, or set it to the folder hash that `register` prints."
why = "The box copies the payload folder at registration and every row runs that copy. A copy of other code than the pinned code, or code outside the folder, would make the records name code that did not run."
sources = []
check = "documented"
