name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands. Replace private paths with placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the full error output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit, or the output of `ignorarium --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and Rust version.
  - type: checkboxes
    id: rule
    attributes:
      label: Checks
      options:
        - label: I said in the text whether I used an AI tool to write this (see AI_POLICY.md).
          required: true
