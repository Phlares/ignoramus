[workspace]
resolver = "3"
members = ["crates/ignorarium", "crates/evidence", "crates/ignorarium-guest", "crates/bundle", "crates/deposit", "crates/litmus"]

# The power gate simulates thousands of replicates on every check; an unoptimized build
# makes each check, and the test suite, many times slower.
[profile.dev.package.evidence]
opt-level = 3

# The runner hashes the whole payload folder before every row. An unoptimized build hashes
# about 40 MB/s, so a 14 MB debug payload costs 0.35 s per row.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
