[package]
name = "litmus"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "A synthetic study with known answers, to test the box."

[dependencies]
sha2 = "0.11"
hex = "0.4"
rustix = { version = "1", features = ["time"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
