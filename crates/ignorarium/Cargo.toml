[package]
name = "ignorarium"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Checks experiment plans before they run."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
sha2 = "0.11"
hex = "0.4"
digest-io = "0.1"
regex = "1"
getrandom = "0.4"
ed25519-dalek = "3"
rustix = { version = "1", features = ["process", "pipe", "net"] }
libc = "0.2"
seccompiler = "0.5"
tar = { version = "0.4", default-features = false }
flate2 = "1"
x509-tsp = "0.1"
cms = "0.2"
cmpv2 = "0.2"
evidence = { path = "../evidence" }
ignorarium-guest = { path = "../ignorarium-guest" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
