[package]
name = "ignorarium"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Checks experiment plans before they run."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
regex = "1"
getrandom = "0.3"
ed25519-dalek = "2"
rustix = { version = "1", features = ["process", "pipe", "net"] }
libc = "0.2"
seccompiler = "0.5"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
