[study]
id = "bal-brief"                 # ASCII kebab-case
template = "numeric-ablation"   # numeric-ablation | planted-spawn
mode = "confirmatory"            # exploratory | confirmatory
label = "signal"                # signal | confirmed | replicated | generalized
test_log = false                # true: register into the test log, never counts

[question]
population = ""
intervention = ""
comparator = ""
negative_control = ""
[[question.hypotheses]]
id = "H1"
statement = ""
rival = ""
outcome = "ppl-ratio"
contrast = { arm-a = 1.0 }
claim = { below = 0.0 }
statistic = { mean = [-50.0, 50.0] }
power_at = -1.0
estimates = { from = "bal-pilot" }
alpha_share = 1.0
[[question.hypotheses]]
id = "H2"
statement = ""
rival = ""
outcome = "ppl-ratio"
contrast = { arm-a = 1.0 }

[[outcomes]]
id = "ppl-ratio"
unit = "ratio"                  # required
direction = "lower"             # lower | higher (which is better)
measure = "ppl"                 # the key the payload writes in values.json
paired = "percent"              # difference | percent (against the reference condition)
registered = true

[scope]
min_isolation = 1               # 0..3
stop_rule = "budget-only"       # budget-only | e-process
[scope.budget]
cpu_hours = 1.0
wall_hours = 1.0
money_usd = 0.0
[scope.end_of_run]
route = "report"                # report | follow-on | share
follow_on = []                  # [{ when = "done", spec = "follow/next.toml" }]

[design]
unit = "window"
cluster = "text"                # optional; "" if none
stratum = "genre"               # optional; "" if none
reference = "exact"             # condition id of the reference arm
repeats = 1
row_seconds = 60.0              # estimate per row, until a record gives one
power = 0.8
units_per_cluster = 5
[[design.conditions]]
id = "exact"
[[design.conditions]]
id = "arm-a"
[design.confirmation]
conditions = ["arm-a"]

[[inputs]]
path = "bal-confirm.txt"       # relative to the study folder
sha256 = ""
role = "confirmation"            # calibration | selection | confirmation | model
stratum = "code"
units = 31
[inputs.licence]
spdx = ""                       # SPDX id, or "" when none was given
type = "unspecified"            # common | custom | request-form | unspecified
source = ""
creators = []

[pins]
environment = ""
payload = ""
rule_base = ""

[mutations]
depth_cap = 2
operators = []                  # [{ name, type = "int"|"float"|"enum", range = [..], acts_on }]
triggers = []                   # [{ id, metric, threshold_e }]
[mutations.seeds]
spawn = "spawn/"
report = "report/"

[access]
blind = false

[report]
licence_code = "Apache-2.0"
licence_data = "CC0-1.0"
publish = "none"                # none | zenodo-sandbox
