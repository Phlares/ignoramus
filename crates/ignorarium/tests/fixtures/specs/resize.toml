# A confirmatory plan that re-sizes once from a reserve: two confirmation clusters and two
# reserve clusters in each of two strata. Each input holds its own path and a newline.
[study]
id = "resize-study"
template = "numeric-ablation"
mode = "confirmatory"
label = "confirmed"
test_log = false

[question]
population = ""
intervention = ""
comparator = ""
negative_control = ""
[[question.hypotheses]]
id = "H1"
statement = ""
rival = ""
outcome = "ppl-ratio"
contrast = { arm-a = 1.0 }
strata = ["fiction", "news"]
claim = { below = 0.0 }
statistic = { mean = [-50.0, 50.0] }
power_at = -1.0
estimates = { from = "my-pilot" }
alpha_share = 1.0

[[outcomes]]
id = "ppl-ratio"
unit = "ratio"
direction = "lower"
measure = "ppl"
paired = "percent"
registered = true

[scope]
min_isolation = 1
stop_rule = "budget-only"
[scope.budget]
cpu_hours = 1.0
wall_hours = 1.0
money_usd = 0.0
[scope.end_of_run]
route = "report"
follow_on = []

[design]
unit = "window"
cluster = "text"
stratum = "genre"
reference = "exact"
repeats = 1
row_seconds = 60.0
power = 0.8
units_per_cluster = 3
pick = "seeded"
[[design.conditions]]
id = "exact"
[[design.conditions]]
id = "arm-a"
[design.confirmation]
conditions = ["arm-a"]
[design.resize]
rule = "blinded-once"

