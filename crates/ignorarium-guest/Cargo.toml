[package]
name = "ignorarium-guest"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Runs one experiment row inside a virtual machine."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs", "mount", "process", "system", "time"] }

[dev-dependencies]
tempfile = "3"
