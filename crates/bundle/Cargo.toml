[package]
name = "bundle"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Builds a study's publish bundle: metadata, licences, manifest, zip."

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"
