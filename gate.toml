[[check]]
name = "lint"
# The manual stage adds gitleaks-history, which scans the checkout.
run = "pre-commit run --all-files --hook-stage manual --show-diff-on-failure"

[[check]]
name = "test"
run = "cargo test --locked"
# Every test run that prints its `running` line must print a `test result:`
# line. Cargo's target lines do not pair up: one Doc-tests line can hold two
# test runs. See docs/decisions/0037.
count = ['^running \d+ tests?$', '^test result: ']
