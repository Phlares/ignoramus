[[check]]
name = "lint"
# The manual stage adds gitleaks-history, which scans the checkout.
run = "pre-commit run --all-files --hook-stage manual --show-diff-on-failure"

[[check]]
name = "test"
run = "cargo test --locked"
# Every test target that starts must print a result line.
count = ['^\s+(Running|Doc-tests) ', '^test result: ']
