# The steps of a study, in order. `ignorarium guide` prints them.

[[step]]
id = "brief"
title = "Write the brief"
does = "State the question, the claim you want to earn and the limits, in plain words."
produces = "A short brief that you turn into a spec."
command = "ignorarium guide"

[[step]]
id = "template"
title = "Pick a template"
does = "Copy a template into a new study folder under the current directory."
produces = "studies/<id>/spec.toml"
command = "ignorarium new --template numeric-ablation --id <id>"

[[step]]
id = "fill"
title = "Fill in the spec"
does = "Replace each empty field with the real value. Keep the comments for the fields you did not change. Write file paths from the study root: the nearest folder above the spec that holds ignorarium.toml, or the spec's own folder. Each hypothesis names its outcome and its contrast: condition ids and their weights, over values paired with the reference. A claim (below, above or within margins) with its statistic makes the hypothesis testable; in a confirmatory study every hypothesis needs one."
produces = "A complete spec.toml."
command = "edit studies/<id>/spec.toml"

[[step]]
id = "payload"
title = "Write the payload"
does = "Put the program the box runs for each row in payload/ under the study root: an executable payload/run and the files it uses, with no links. It gets --condition (for a selected row, the condition the selection stage picked), --unit (`<input path>#<index>`, a unit of a selection or confirmation input) and --repeat, and the condition's params as JSON in IGNORARIUM_PARAMS. A param can be { from = \"<study id>\" }: it takes the condition that finished study selected, and register freezes it. It reads its inputs from the folder in IGNORARIUM_IN, which also holds the input list ignorarium:inputs.json: a JSON array with one {\"path\", \"role\", \"sha256\"} object per input there, in spec order, each path spelled as the view holds it (empty segments dropped). It writes its results to the folder in IGNORARIUM_OUT. It must write values.json there: one JSON object with one finite number for each outcome's measure, for example {\"ppl\": 12.5}. A row with no readable values.json is void. Set design.row_memory_mib to the most memory one process of the payload may use, in MiB: at every level each process's heap and private writable memory maps stay under it, and an allocation past it fails, which fails the row as the payload's own failure. The cap is per process, and a level 2 machine holds one: a payload that starts several large processes can run out of memory there. Without it a row has no cap at levels 0 and 1, and a 1024 MiB machine at level 2. Set pins.deterministic = true when the same job always gives the same output: the box then runs one row of each condition a second time, in another output folder, with the same arguments, IGNORARIUM_SEED and IGNORARIUM_ROW, and compares the exits and the outputs when both ran in the same environment at the same level, and neither is void or ended at its wall timeout. A difference stops a confirmatory run and is flagged in an exploratory one. A confirmatory plan that takes estimates from a study whose check passed, pins that study's payload and environment, and sets scope.min_isolation to 1 or more carries that check and runs no recheck rows; check shows where its determinism comes from. register copies the folder, so later edits do not reach the run."
produces = "An executable payload/run, and the files it uses, under the study root."
command = "edit studies/<id>/payload/run"

[[step]]
id = "import"
title = "Import the data"
does = "Optional. Add a data file to the box's store, then pin the input in the spec by the digest this prints. The store keeps the bytes, so the study does not depend on the file staying where it was."
produces = "The file's SHA-256 digest and a signed entry in the store's import log."
command = "ignorarium import --source <where the file came from> <file>"

[[step]]
id = "check"
title = "Check the plan"
does = "Run every rule on the spec. Fix each error the output lists, then run again until it passes. It exits 3 when no error is left but a value waits on a study that has not finished, such as the pilot whose estimates size a confirmatory hypothesis: run that study first."
produces = "Diagnostics, a cost estimate and the claim label the plan can earn."
command = "ignorarium check studies/<id>/spec.toml"

[[step]]
id = "review"
title = "Review the plan"
does = "Print one page that a person reads before approving the plan."
produces = "A Markdown page with the plan, the cost and the warnings."
command = "ignorarium review studies/<id>/spec.toml"

[[step]]
id = "register"
title = "Register the plan"
does = "A person types the first 8 characters of the spec hash to approve. The plan is then frozen, with the records of other studies it takes values from. It refuses while a value waits on a study that has not finished."
produces = "A frozen copy of the spec and of the payload folder, every input in the box's store, and a signed entry in the plan log."
command = "ignorarium register studies/<id>/spec.toml"

[[step]]
id = "run"
title = "Run the plan"
does = "Runs each row of the registered plan and signs a record for each. At isolation level 0 a row is a plain process on this machine, with no network or file isolation. Pause, resume or stop it with the verbs of the same names. Start run and resume in the study root when an input was absent at registration: the box reads that input from there."
produces = "A signed record for every row, and an event log."
command = "ignorarium run <id>"

[[step]]
id = "status"
title = "Check progress"
does = "Shows rows done, time, cost against each budget cap, and voided or retried rows. Condition names stay hidden when the plan blinds them."
produces = "A progress summary. Add --json for the same fields as JSON."
command = "ignorarium status <id>"

[[step]]
id = "report"
title = "Write the report"
does = "Turns the run records into a report: not available yet."
produces = "A report: not available yet."
command = "not available yet"
